site_name: delivery-service
site_description: Hand an AI agent a task in plain English. Your own tests check the result, and the work is left on a branch for you.
site_url: https://jorjives.github.io/delivery-service/
repo_url: https://github.com/jorjives/delivery-service
repo_name: jorjives/delivery-service
edit_uri: edit/main/docs/

# docs/ also keeps the design history (design notes, PRDs, specs, personas):
# records of how the harness was designed, not documentation of how to use it.
exclude_docs: |
  prd/
  superpowers/
  personas.md
  agent-interface.md
  multi-surface-control-flow.md
  single-surface-control-flow.md
  provisioning.md

validation:
  omitted_files: warn
  absolute_links: warn
  anchors: warn

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

# llms.txt and llms-full.txt: the pages as plain Markdown, for people reading
# the docs through an AI assistant.
plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        delivery-service hands an AI agent a task in plain English. It works on a
        copy of your repository, your own tests check the result, and the work is
        left on a branch for you.
      sections:
        Start:
          - index.md
          - getting-started.md
          - concepts.md
        Guides:
          - project-configuration.md
          - set-up-with-init.md
          - check-your-setup.md
          - run-a-task.md
          - run-a-task-list.md
          - work-a-backlog.md
          - run-on-a-schedule.md
          - resume-a-run.md
          - shared-environment.md
          - check-a-run.md
          - read-a-report.md
          - task-packs.md
        Extend:
          - configuring-a-role.md
          - writing-a-gate.md
          - writing-a-closer.md
          - writing-a-pack.md
          - testing-your-pipeline.md
        Reference:
          - cli-reference.md
          - configuration-reference.md
          - reporting.md
          - glossary.md

# Only what the pages use: attr_list and md_in_html build the home page's
# buttons and cards; the rest is Material's standard code rendering.
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Set up:
          - Set up a project: project-configuration.md
          - Set up with questions: set-up-with-init.md
          - Check your setup: check-your-setup.md
      - Run work:
          - Run a task: run-a-task.md
          - Work through a task list: run-a-task-list.md
          - Work through a backlog: work-a-backlog.md
          - Run on a schedule: run-on-a-schedule.md
          - Pick up an interrupted run: resume-a-run.md
          - When the shared environment breaks: shared-environment.md
      - Follow results:
          - See what happened to a run: check-a-run.md
          - Read the report: read-a-report.md
      - Review your project: task-packs.md
  - Extend:
      - Configure a role: configuring-a-role.md
      - Write a gate: writing-a-gate.md
      - Write a closer: writing-a-closer.md
      - Write a pack: writing-a-pack.md
      - Test your pipeline: testing-your-pipeline.md
  - Concepts: concepts.md
  - Reference:
      - Command reference: cli-reference.md
      - Configuration reference: configuration-reference.md
      - Reports as data: reporting.md
      - Glossary: glossary.md

