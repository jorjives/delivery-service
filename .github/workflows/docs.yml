name: Docs

on:
  push:
    branches: ["main"]
  # A pull request builds the site (the check) but never deploys it.
  pull_request:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Warnings are errors: a broken link or a stray page fails the build.
      # Python is preinstalled on the runner, so no third-party action is needed.
      - name: Build the site
        run: |
          python3 -m venv .docs-venv
          .docs-venv/bin/pip install --quiet 'mkdocs-material~=9.7' 'mkdocs-llmstxt~=0.5'
          .docs-venv/bin/mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    # One deployment at a time; a newer push supersedes a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
