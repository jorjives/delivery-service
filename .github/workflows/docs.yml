name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Warnings are errors: a broken link or a stray page fails the build.
      # pipx is preinstalled on the runner, so no third-party action is needed.
      - name: Build the site
        run: pipx run --spec 'mkdocs-material~=9.7' mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
